[package]
name = "rusted-engine-docs"
version = "0.5.0"
description = "RustedEngine Documentation Desktop App"
authors = ["Szymon"]
edition = "2024"

[[bin]]
name = "rusted-engine-docs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
